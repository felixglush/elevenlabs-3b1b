[project]
name = "explainer-videos"
version = "0.1.0"
description = "Turn system design, agentic and NeetCode topics into 3Blue1Brown-style narrated, captioned videos."
requires-python = ">=3.10"
dependencies = ["manim>=0.18", "pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
draft = ["anthropic"]
dev = ["pytest"]

[project.scripts]
explainer = "explainer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["explainer"]
